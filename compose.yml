services:

  router:
    build: ./docker/router
    hostname: router
    networks:
      rede_wan:
        ipv4_address: 192.168.200.254  
        interface_name: eth0  
      dhcp_lab:
        ipv4_address: 192.168.10.254
        interface_name: eth1
      rede2:
        ipv4_address: 192.168.140.254
        interface_name: eth2
  arya:
    build: docker/dnsserver
    hostname: arya
    networks: 
      dhcp_lab:
        ipv4_address: 192.168.10.1  
    volumes:
      - ./dnsserver/named.conf.local:/etc/bind/named.conf.local
      - ./dnsserver/zonas:/var/cache/bind/zonas          
  kea:
    build: ./docker/kea
    container_name: kea
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  bran:
    build: ./docker/cliente
    container_name: bran
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.221
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - kea
      - cliente2

  cliente2:
    build: ./docker/cliente

    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.222

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - kea

networks:
  dhcp_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  rede2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24
  
  rede3:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24
  rede_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.130.0/24             