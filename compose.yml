services:

  router:
    build: ./docker/router
    hostname: router
    networks:
      rede_wan:
        ipv4_address: 192.168.200.254  
        interface_name: eth0  
      dhcp_lab:
        ipv4_address: 192.168.10.254
        interface_name: eth1
      rede2:
        ipv4_address: 192.168.11.254
        interface_name: eth2
      rede3:
        ipv4_address: 192.168.12.254
        interface_name: eth3
  arya:
    build: docker/dnsserver
    hostname: arya
    networks: 
      dhcp_lab:
        ipv4_address: 192.168.10.9  
    volumes:
      - ./arya/named.conf.local:/etc/bind/named.conf.local
      - ./arya/zonas:/var/cache/bind/zonas          
  ned:
    build: ./docker/kea
    container_name: ned
    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.2
    volumes:
      - ./ned/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  bran:
    build: ./docker/cliente
    container_name: bran
    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.221
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      - cliente2

  cliente2:
    build: ./docker/cliente

    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.222

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  cliente3:
    build: ./docker/cliente
    container_name: cliente3
    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.223

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      - cliente2

  cliente4:
    build: ./docker/cliente
    container_name: cliente4
    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.224

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      - cliente2

  cliente5:
    build: ./docker/cliente
    container_name: cliente5
    networks:
      rede2:
        ipv4_address: 192.168.11.224

    command: >
      sh -c "dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      - cliente2

networks:
  dhcp_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  rede2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24
  
  rede3:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24
  rede_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24             